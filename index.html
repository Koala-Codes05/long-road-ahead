<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Long Road Ahead – Open World Racing</title>
    <meta name="description" content="An open-world procedural racing game inspired by Need for Speed and Driveclub, built with Three.js and WebGL">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader-content">
            <h1 class="game-title">LONG ROAD AHEAD</h1>
            <p class="loader-subtitle" id="loader-status">INITIALIZING DRIVECLUB WEATHER ENGINE...</p>
            <div class="loader-bar" id="loader-bar-box">
                <div class="loader-fill" id="loader-fill"></div>
            </div>
            <button id="start-btn" style="display: none;">CLICK TO DRIVE</button>
        </div>
    </div>

    <!-- Driveclub HUD Overlay -->
    <div id="hud" style="display: none;">

        <!-- Top Left: Position & Lap Time -->
        <div id="dc-top-left">
            <div class="dc-label">POS</div>
            <div id="dc-pos"><span id="pos-val">1</span><span class="dc-total">/8</span></div>
            <div id="dc-time">0:42.798</div>
        </div>

        <!-- Performance HUD -->
        <div id="fps-hud-panel">
            <div id="fps-counter-badge">
                <span class="fps-icon">⚡</span>
                <span id="fps-val">60</span> <span class="fps-unit">FPS</span>
                <span class="fps-separator">|</span>
                <span id="frametime-val">16.67</span><span class="fps-unit">ms</span>
            </div>
        </div>

        <!-- Top Center: Fame / Score Star -->
        <div id="dc-top-center">
            <span id="dc-score">3,512</span>
            <span class="dc-star">★</span>
        </div>

        <!-- Top Right: Lap Counter -->
        <div id="dc-top-right">
            <div class="dc-label">LAP</div>
            <div id="dc-lap">1/3</div>
        </div>

        <!-- Weather Preset Selector Bar -->
        <div id="weather-selector">
            <button class="weather-btn active" data-type="0">STORM ⚡</button>
            <button class="weather-btn" data-type="1">DRIZZLE 🌧️</button>
            <button class="weather-btn" data-type="3">CLEAR 🌙</button>
        </div>

        <!-- Vehicle Lighting Status Bar -->
        <div id="lights-hud-bar">
            <span id="badge-headlights" class="light-badge active-low">💡 LOW</span>
            <span id="badge-signal-left" class="light-badge">◄</span>
            <span id="badge-hazards" class="light-badge">▲</span>
            <span id="badge-signal-right" class="light-badge">►</span>
            <span id="badge-underglow" class="light-badge active-neon">NEON</span>
        </div>

        <!-- Bottom Left: Track Minimap -->
        <div id="dc-minimap">
            <svg viewBox="0 0 100 100" class="minimap-svg">
                <path d="M 15,80 Q 20,20 50,20 T 85,80 Z" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="3.5" stroke-linecap="round"/>
                <polygon points="50,18 45,26 55,26" fill="#00ff66"/>
            </svg>
        </div>

        <!-- Precision Indicator -->
        <div id="precision-badge" style="display: none;">50% SENS (PRECISION)</div>

        <!-- Bottom Right: Driveclub Circular Dial Gauge (Speed + Gear) -->
        <div id="dc-gauge-panel">
            <svg class="gauge-svg" viewBox="0 0 160 160">
                <!-- Background Dial Arc -->
                <path class="gauge-bg" d="M 30,130 A 65,65 0 1,1 130,130" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
                <!-- RPM Arc Fill -->
                <path id="gauge-rpm-arc" d="M 30,130 A 65,65 0 1,1 130,130" fill="none" stroke="#ffffff" stroke-width="5" stroke-dasharray="310" stroke-dashoffset="310"/>
                <!-- Redline Tick -->
                <path class="gauge-redline" d="M 120,118 A 65,65 0 0,1 130,130" fill="none" stroke="#ff3333" stroke-width="6"/>
            </svg>
            <div class="gauge-center-content">
                <div id="speed-value">0</div>
                <div id="speed-unit">KM/H</div>
                <div id="gear-box">
                    <span id="gear-display">N</span>
                </div>
            </div>
        </div>

        <!-- Controls Hint -->
        <div id="controls-hint">
            <span>W/↑</span> Accelerate &nbsp;
            <span>S/↓</span> Brake &nbsp;
            <span>A/←</span> Left &nbsp;
            <span>D/→</span> Right &nbsp;
            <span>SPACE</span> Handbrake &nbsp;
            <span>L-SHIFT</span> Nitro &nbsp;
            <span>L</span> Lights &nbsp;
            <span>H</span> Hazards &nbsp;
            <span>Q/E</span> Signals &nbsp;
            <span>U</span> Neon
        </div>
    </div>

    <!-- Speed Effect Overlay -->
    <div id="speed-overlay"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
